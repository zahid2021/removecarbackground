# Render Blueprint — frontend (instant CDN) + API (Python)
# Custom domain removecarbackground.com → attach to the static site in Dashboard,
# then point DNS (see README / DOMAIN.md).

databases:
  - name: rcb-db
    plan: free
    databaseName: rcb
    user: rcb

services:
  - type: web
    name: removecarbackground
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: OMP_NUM_THREADS=1 ORT_NUM_THREADS=1 uvicorn backend:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: rcb-db
          property: connectionString
      - key: PUBLIC_BASE_URL
        value: https://removecarbackground.com
      - key: ALLOW_GUEST_PROCESS
        value: "1"
      - key: ALLOW_DEMO_TOPUP
        value: "1"
      - key: AUTO_SAVE_ADVERTS
        value: "1"
      - key: REMBG_MODEL
        value: "u2netp"
      - key: PROCESS_MAX_SIDE
        value: "768"
      - key: REMBG_HARD_CAP
        value: "768"
      - key: LOW_MEMORY
        value: "1"
      - key: WARMUP_REMBG
        value: "0"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: ORT_NUM_THREADS
        value: "1"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  - type: web
    name: rcb-demo
    runtime: static
    plan: free
    buildCommand: bash build-static.sh
    staticPublishPath: dist
    domains:
      - removecarbackground.com
      - www.removecarbackground.com
    routes:
      # Old .html bookmarks → clean paths (no .html in public URLs)
      - type: redirect
        source: /transformer.html
        destination: /
      - type: redirect
        source: /transformer
        destination: /
      - type: redirect
        source: /index.html
        destination: /
      - type: redirect
        source: /account.html
        destination: /account
      - type: redirect
        source: /editor.html
        destination: /editor
      - type: redirect
        source: /login.html
        destination: /login
      - type: redirect
        source: /signup.html
        destination: /signup
      - type: redirect
        source: /examples.html
        destination: /examples
      - type: redirect
        source: /blog.html
        destination: /blog
      - type: redirect
        source: /meet.html
        destination: /meet
      - type: redirect
        source: /contact.html
        destination: /contact
      - type: redirect
        source: /invite.html
        destination: /invite
      - type: redirect
        source: /privacy.html
        destination: /privacy
      - type: redirect
        source: /terms.html
        destination: /terms
      - type: redirect
        source: /disclaimer.html
        destination: /disclaimer
