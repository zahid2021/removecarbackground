# Render Blueprint — frontend (instant CDN) + API (Python)
# Custom domain removecarbackground.com → attach to the static site in Dashboard,
# then point DNS (see README / DOMAIN.md).

databases:
  - name: rcb-db
    plan: free
    databaseName: rcb
    user: rcb

services:
  - type: web
    name: removecarbackground
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: OMP_NUM_THREADS=1 ORT_NUM_THREADS=1 uvicorn backend:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: rcb-db
          property: connectionString
      - key: PUBLIC_BASE_URL
        value: https://removecarbackground.com
      - key: ALLOW_GUEST_PROCESS
        value: "1"
      - key: ALLOW_DEMO_TOPUP
        value: "1"
      - key: AUTO_SAVE_ADVERTS
        value: "1"
      - key: REMBG_MODEL
        value: "u2netp"
      - key: PROCESS_MAX_SIDE
        value: "1024"
      - key: REMBG_HARD_CAP
        value: "960"
      - key: LOW_MEMORY
        value: "1"
      - key: WARMUP_REMBG
        value: "0"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: ORT_NUM_THREADS
        value: "1"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  - type: web
    name: rcb-demo
    runtime: static
    plan: free
    buildCommand: bash build-static.sh
    staticPublishPath: dist
    domains:
      - removecarbackground.com
      - www.removecarbackground.com
