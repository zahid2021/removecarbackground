# Render Blueprint — frontend (instant CDN) + API (Python)
# Custom domain removecarbackground.com → attach to the static site in Dashboard,
# then point DNS (see README / DOMAIN.md).

services:
  - type: web
    name: removecarbackground
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        value: https://removecarbackground.com
      - key: ALLOW_GUEST_PROCESS
        value: "1"
      - key: ALLOW_DEMO_TOPUP
        value: "1"
      - key: AUTO_SAVE_ADVERTS
        value: "1"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  - type: web
    name: rcb-demo
    runtime: static
    plan: free
    buildCommand: bash build-static.sh
    staticPublishPath: dist
    domains:
      - removecarbackground.com
      - www.removecarbackground.com
